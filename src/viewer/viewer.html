<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scholar Reader</title>
    <link rel="stylesheet" href="pdf_viewer.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="controls.css" />
    <link rel="stylesheet" href="debug.css" />
    <link rel="stylesheet" href="outline.css" />
  </head>
  <body>
    <header id="toolbar">
      <span id="doc-title">Scholar Reader</span>
      <div id="toolbar-controls">
        <button id="zoom-out" title="Zoom out">&minus;</button>
        <input id="zoom-input" class="toolbar-field" type="text" inputmode="decimal" value="&ndash;" aria-label="Zoom level" title="Zoom — type a percentage" autocomplete="off" spellcheck="false" />
        <button id="zoom-in" title="Zoom in">+</button>
        <span id="page-indicator">
          <input id="page-input" class="toolbar-field" type="text" inputmode="numeric" value="&ndash;" aria-label="Page number" title="Go to page" autocomplete="off" spellcheck="false" />
          <span id="page-total">/ &ndash;</span>
        </span>
        <button id="theme-toggle" title="Toggle theme"></button>
      </div>
    </header>

    <div id="panes">
      <main id="pdf-pane">
        <div id="viewerContainer"><div id="viewer" class="pdfViewer"></div></div>
        <div id="pdf-status">
          <span class="status-title">Loading…</span>
          <span class="status-detail"></span>
        </div>
      </main>
      <div id="pane-resizer" role="separator" aria-orientation="vertical" aria-label="Resize outline pane" title="Drag to resize · double-click to reset" tabindex="0"></div>
      <aside id="outline-pane">
        <p id="pane-note" class="pane-note" hidden></p>
        <div id="outline-root"></div>
        <div id="debug-pane"></div>
      </aside>
    </div>

    <script src="viewer.js"></script>
  </body>
</html>
